# ■■ Production overrides — active only when SPRING_PROFILES_ACTIVE=prod ■■■■■■■■■■■■■■■■■■
# Set this env var on your deploy platform (e.g. Render) to layer these on top of
# application.properties. Nothing changes locally unless you explicitly set it.

# ■■ SpringDoc / Swagger UI ■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■
# Exposing the full API surface (every endpoint, DTO field, parameter) to anyone who asks is a
# disclosure risk not worth taking in production — springdoc simply won't register these
# controllers when disabled, so /v3/api-docs and /swagger-ui/** 404 instead of serving content.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# ■■ Seeding ■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■
# Hard-locked regardless of APP_SEEDING_ENABLED — a profile-specific value always overrides the
# base application.properties file, so this can't be flipped on in prod by an env var mistake.
# Seeding creates loginable sample accounts with known passwords.
app.seeding.enabled=false

# ■■ Error responses ■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■
# GlobalExceptionHandler covers the exceptions it knows about; this is defense-in-depth for
# anything unexpected that falls through to Spring Boot's default error handling instead.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
