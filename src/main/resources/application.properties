spring.application.name=unisphere-backend

# ■■ Database ■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/unisphere}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ■■ JPA / Hibernate ■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ■■ Liquibase ■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# ■■ JWT ■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:900000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# ■■ CORS ■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5174}

# ■■ SpringDoc / Swagger UI ■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# ■■ Seeding ■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■
# Never enable in production — creates loginable sample accounts with known passwords
app.seeding.enabled=${APP_SEEDING_ENABLED:false}

# ■■ Resend (HTTP API — not SMTP, so no port-blocking issues on cloud) ■■■■■■
resend.api-key=${RESEND_API_KEY}

# ■■ App ■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■
app.mail.from=${MAIL_FROM:UniSphere <onboarding@resend.dev>}
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}

# ■■ Redis (Redis Cloud) ■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:default}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}

# ■■ Backblaze B2 ■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■
# Endpoint format: https://s3.{region}.backblazeb2.com
backblaze.b2.endpoint=${B2_ENDPOINT:}
backblaze.b2.region=${B2_REGION:us-west-004}
backblaze.b2.key-id=${B2_KEY_ID:}
backblaze.b2.application-key=${B2_APPLICATION_KEY:}
backblaze.b2.bucket.posts=${B2_BUCKET_POSTS:posts}
backblaze.b2.presign-expiry-minutes=${B2_PRESIGN_EXPIRY:5}

# ■■ Server ■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■
server.port=${PORT:8081}
