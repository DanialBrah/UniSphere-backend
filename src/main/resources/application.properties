spring.application.name=unisphere-backend

# ■■ Database ■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/unisphere}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ■■ JPA / Hibernate ■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ■■ Liquibase ■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# ■■ JWT ■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:900000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# ■■ CORS ■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■
# Must list every origin the SPA is served from — the refresh-token cookie is sent with
# credentials, and CORS forbids wildcard origins once credentials are involved.
# 5173 = vite dev server, 5174 = the docker-compose frontend container.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}

# ■■ Refresh-token cookie ■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■
# secure=true requires HTTPS — keep false for local http dev, true in any real deployment.
# same-site=Lax is the CSRF defence and works when the SPA and API share a site (including
# different ports on localhost). Set None (plus secure=true) only if they are genuinely
# cross-site, e.g. netlify.app vs onrender.com.
app.auth.cookie.secure=${AUTH_COOKIE_SECURE:false}
app.auth.cookie.same-site=${AUTH_COOKIE_SAME_SITE:Lax}

# ■■ SpringDoc / Swagger UI ■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# ■■ Seeding ■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■
# Never enable in production — creates loginable sample accounts with known passwords
app.seeding.enabled=${APP_SEEDING_ENABLED:false}

# ■■ Resend (HTTP API — not SMTP, so no port-blocking issues on cloud) ■■■■■■
resend.api-key=${RESEND_API_KEY}

# ■■ App ■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■
app.mail.from=${MAIL_FROM:UniSphere <onboarding@resend.dev>}
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}

# ■■ Redis (Redis Cloud) ■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■
spring.data.redis.repositories.enabled=false
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:default}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}

# ■■ Object storage (S3-compatible — Backblaze B2 / Google Cloud Storage / Garage) ■■
# Endpoint format examples: https://s3.{region}.backblazeb2.com (B2), https://storage.googleapis.com (GCS),
# https://storage.yourdomain.com (self-hosted Garage). Swap providers by changing only these values —
# see miscellaneous/plan/object-storage-provider-swap.md for the full credential matrix.
object-storage.endpoint=${STORAGE_ENDPOINT:}
object-storage.region=${STORAGE_REGION:us-west-004}
object-storage.access-key-id=${STORAGE_ACCESS_KEY_ID:}
object-storage.secret-access-key=${STORAGE_SECRET_ACCESS_KEY:}
object-storage.bucket.posts=${STORAGE_BUCKET_POSTS:posts}
object-storage.presign-expiry-minutes=${STORAGE_PRESIGN_EXPIRY:5}
# Read URLs ride inside feed responses, so they must outlive any client-side caching of that JSON.
# This also bounds how long an already-issued URL keeps working after a viewer loses access.
object-storage.presign-get-expiry-minutes=${STORAGE_PRESIGN_GET_EXPIRY:60}

# ■■ Server ■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■
server.port=${PORT:8081}

# ■■ Build provenance ■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■
# Two-level fallback because the image is built in two places: APP_GIT_SHA comes from
# the Dockerfile build-arg (CI), RENDER_GIT_COMMIT from Render. "unknown" runs locally.
app.git-sha=${APP_GIT_SHA:${RENDER_GIT_COMMIT:unknown}}

# ■■ File upload limits (align with nginx's client_max_body_size in production) ■■■
spring.servlet.multipart.max-file-size=${MAX_UPLOAD_FILE_SIZE:50MB}
spring.servlet.multipart.max-request-size=${MAX_UPLOAD_REQUEST_SIZE:50MB}

# ■■ Gemini (Google AI Studio) ■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-2.0-flash}
gemini.base-url=https://generativelanguage.googleapis.com
gemini.max-history-turns=20
gemini.cache-ttl-hours=24
gemini.session-ttl-hours=24
gemini.connect-timeout-ms=${GEMINI_CONNECT_TIMEOUT:5000}
gemini.read-timeout-ms=${GEMINI_READ_TIMEOUT:30000}

# ■■ Messaging cache ■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■
messaging.history-ttl-hours=48
messaging.history-max-messages=100

# ■■ Campus news ■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■
# Scheduled-publish sweep. The flip is a single bulk UPDATE guarded by status = DRAFT, so every
# replica can run it without a distributed lock — raising the interval only widens the window
# between scheduled_at and the article actually appearing. Cron fires in UTC; scheduled_at is a
# naive DATETIME read against the JVM's zone, so keep the container on UTC (Render already is).
news.publish-cron=${NEWS_PUBLISH_CRON:0 * * * * *}
# News media shares object-storage.bucket.posts on purpose — MediaUrlResolver presigns against
# that bucket unconditionally, so a separate bucket would yield silently broken image URLs.
# Segregation is by the news/{userId}/ key prefix instead.

# ■■ Lost & Found ■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■
# Auto-expiry sweep. Same shape as news.publish-cron: one bulk UPDATE guarded by status = OPEN, so
# every replica can run it without a distributed lock — raising the interval only widens the window
# before a stale item drops out of the feed. Cron fires in UTC while created_at is a naive DATETIME
# read against the JVM's zone, so keep the container on UTC (Render already is). Daily rather than
# per-minute because expiry has day granularity.
lost-found.expiry-cron=${LOST_FOUND_EXPIRY_CRON:0 15 3 * * *}
lost-found.expiry-days=${LOST_FOUND_EXPIRY_DAYS:60}
# /items/nearby — the cap bounds how much of idx_lfitem_geo a single request can scan. An
# over-large radius is clamped rather than rejected: it is a UI slider at its end stop, not an error.
lost-found.nearby-default-radius-km=${LOST_FOUND_NEARBY_DEFAULT_RADIUS_KM:5}
lost-found.nearby-max-radius-km=${LOST_FOUND_NEARBY_MAX_RADIUS_KM:50}
# /items/map — hard cap on pins per viewport. No pagination; the client re-queries on pan.
lost-found.map-max-pins=${LOST_FOUND_MAP_MAX_PINS:500}
# Coordinate precision handed to a viewer with no approved claim on a FOUND item. 2 dp is roughly
# 1.1 km — enough to say "somewhere on the main campus" without handing a fraudulent claimant the
# answer to the reporter's own "where exactly did you lose it?" question. Deterministic rounding,
# never random jitter: a jittered value could be averaged back to the true point over repeated reads.
lost-found.coarse-coordinate-scale=${LOST_FOUND_COARSE_COORDINATE_SCALE:2}
# Auto-match scoring. candidate-limit bounds the SQL, max-results bounds the response.
lost-found.match.window-days=${LOST_FOUND_MATCH_WINDOW_DAYS:30}
lost-found.match.radius-km=${LOST_FOUND_MATCH_RADIUS_KM:10}
lost-found.match.candidate-limit=${LOST_FOUND_MATCH_CANDIDATE_LIMIT:200}
lost-found.match.max-results=${LOST_FOUND_MATCH_MAX_RESULTS:10}
# Lost & Found media shares object-storage.bucket.posts for the same reason news does —
# MediaUrlResolver presigns against that bucket unconditionally, so a separate bucket would yield
# silently broken image URLs. Segregation is by the lost-found/{userId}/ key prefix instead.

# ■■ Events ■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■
# /events/nearby — same bbox-scan-bound purpose as lost-found.nearby-max-radius-km
events.nearby-default-radius-km=${EVENTS_NEARBY_DEFAULT_RADIUS_KM:5}
events.nearby-max-radius-km=${EVENTS_NEARBY_MAX_RADIUS_KM:50}
# /events/map — hard cap on pins per viewport; unpaginated, client re-queries on pan
events.map-max-pins=${EVENTS_MAP_MAX_PINS:500}
# EventReminderScheduler: how far ahead of start_datetime a reminder fires, and its sweep cadence.
# Every 15 minutes rather than lost-found's once-daily sweep — a reminder window is hour-granularity.
events.reminder-hours-before=${EVENTS_REMINDER_HOURS_BEFORE:24}
events.reminder-cron=${EVENTS_REMINDER_CRON:0 */15 * * * *}
# EventCompletionScheduler: PUBLISHED -> COMPLETED sweep, guarded by status = PUBLISHED so every
# replica can run it with no distributed lock — same shape as lost-found.expiry-cron.
events.completion-cron=${EVENTS_COMPLETION_CRON:0 */15 * * * *}
# Events media shares object-storage.bucket.posts, same reason news/lost-found do — segregated
# by the events/{userId}/ key prefix, not a separate bucket.

# ■■ Jobs ■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■
# Deadline sweep: OPEN -> CLOSED once application_deadline has passed. Daily rather than events'
# 15-minute cadence — a deadline has day granularity, same reasoning as lost-found.expiry-cron. A
# single bulk UPDATE guarded by status = OPEN, so every replica can run it without a distributed lock.
jobs.deadline-cron=${JOBS_DEADLINE_CRON:0 0 1 * * *}
# Résumé upload cap — most job boards cap résumés around 5-10MB, well under the global multipart
# limit (spring.servlet.multipart.max-file-size). Enforced in JobApplicationMediaService.
jobs.resume-max-size-bytes=${JOBS_RESUME_MAX_SIZE_BYTES:10485760}
jobs.default-salary-currency=${JOBS_DEFAULT_SALARY_CURRENCY:MYR}
# Job application media (résumés) shares object-storage.bucket.posts, same reason every other
# module does — segregated by the job-applications/{userId}/ key prefix, not a separate bucket.

# ■■ Projects ■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■
# Cover image upload cap — smaller than jobs.resume-max-size-bytes since this is a single showcase
# image, not a document. Enforced in ProjectMediaService.
projects.cover-image-max-size-bytes=${PROJECTS_COVER_IMAGE_MAX_SIZE_BYTES:5242880}
# Project cover images share object-storage.bucket.posts, same reason every other module does —
# segregated by the projects/{userId}/ key prefix, not a separate bucket.

# ■■ Rate limiting (Redis-backed, fixed window) ■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■
ratelimit.enabled=${RATE_LIMIT_ENABLED:true}
# Per-IP, every public/unauthenticated endpoint (see RateLimitPaths.PUBLIC_PATHS — auth
# endpoints plus health/swagger/api-docs/ws)
ratelimit.auth.limit=${RATE_LIMIT_AUTH_LIMIT:10}
ratelimit.auth.window-seconds=${RATE_LIMIT_AUTH_WINDOW:60}
# Per-user, every protected endpoint
ratelimit.api.limit=${RATE_LIMIT_API_LIMIT:120}
ratelimit.api.window-seconds=${RATE_LIMIT_API_WINDOW:60}
# Per-user, STOMP SEND frames over the WebSocket session (chat messages etc.) — the HTTP
# filters above only ever see the initial /ws handshake, not messages sent after upgrade
ratelimit.ws.limit=${RATE_LIMIT_WS_LIMIT:60}
ratelimit.ws.window-seconds=${RATE_LIMIT_WS_WINDOW:60}
# Per-path overrides — stricter cap on the chatbot endpoint since it calls the paid Gemini API
ratelimit.overrides[0].path-pattern=/api/v1/campus/chatbot/**
ratelimit.overrides[0].limit=${RATE_LIMIT_CHATBOT_LIMIT:20}
ratelimit.overrides[0].window-seconds=${RATE_LIMIT_CHATBOT_WINDOW:60}
# Looser cap on /auth/refresh than the rest of the auth tier. It runs on every page load for
# silent re-auth, so the strict credential-guessing budget would punish normal browsing —
# especially on shared campus NAT, where the whole building keys to one IP. Guessing a refresh
# token is infeasible regardless (it must carry a valid signature and survive a DB lookup), so
# the strict limit buys nothing here.
ratelimit.overrides[1].path-pattern=/api/v1/auth/refresh
ratelimit.overrides[1].limit=${RATE_LIMIT_REFRESH_LIMIT:60}
ratelimit.overrides[1].window-seconds=${RATE_LIMIT_REFRESH_WINDOW:60}
# Per-user cap on the lost-and-found claim endpoints. Submitting a claim fans a notification out to
# the item's reporter, so an unthrottled client is a harassment vector as well as a write amplifier.
# AntPathMatcher's single * matches exactly one path segment, so this cannot shadow the overrides
# above and cannot catch /api/v1/lost-found/claims/{id}. The resolver is method-agnostic, so this
# covers listing too — 10/min is still generous for a human. /items/map and /items/nearby keep the
# default tier: both are index-bounded and hard-capped.
ratelimit.overrides[2].path-pattern=/api/v1/lost-found/items/*/claims
ratelimit.overrides[2].limit=${RATE_LIMIT_LOSTFOUND_CLAIM_LIMIT:10}
ratelimit.overrides[2].window-seconds=${RATE_LIMIT_LOSTFOUND_CLAIM_WINDOW:60}
# Per-user cap on event registration — the one write endpoint a script could hammer to grief a
# capacity-limited event's waitlist ordering. /check-in deliberately keeps the default API tier
# instead: an organizer scanning a real line of attendees at the door needs headroom, not throttling.
ratelimit.overrides[3].path-pattern=/api/v1/events/*/register
ratelimit.overrides[3].limit=${RATE_LIMIT_EVENTS_REGISTER_LIMIT:10}
ratelimit.overrides[3].window-seconds=${RATE_LIMIT_EVENTS_REGISTER_WINDOW:60}
# Per-user cap on submitting a job application — fans a notification out to the employer, same
# spam/harassment-vector reasoning as the lost-found claim and event registration overrides above.
# Method-agnostic like override[2], so it also covers roster paging at the same path.
ratelimit.overrides[4].path-pattern=/api/v1/jobs/*/applications
ratelimit.overrides[4].limit=${RATE_LIMIT_JOBS_APPLY_LIMIT:10}
ratelimit.overrides[4].window-seconds=${RATE_LIMIT_JOBS_APPLY_WINDOW:60}
# Per-user cap on submitting a project application — fans a notification out to the project owner,
# same spam/harassment-vector reasoning as the override above. AntPathMatcher's single * matches
# exactly one path segment, so /{projectId}/roles/*/applications is the shape that matches every
# role under every project.
ratelimit.overrides[5].path-pattern=/api/v1/projects/*/roles/*/applications
ratelimit.overrides[5].limit=${RATE_LIMIT_PROJECTS_APPLY_LIMIT:10}
ratelimit.overrides[5].window-seconds=${RATE_LIMIT_PROJECTS_APPLY_WINDOW:60}
