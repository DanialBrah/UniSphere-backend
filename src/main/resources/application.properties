spring.application.name=unisphere-backend

# ■■ Database ■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/unisphere}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ■■ JPA / Hibernate ■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ■■ Liquibase ■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# ■■ JWT ■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:900000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# ■■ CORS ■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5174}

# ■■ SpringDoc / Swagger UI ■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# ■■ Seeding ■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■
# Never enable in production — creates loginable sample accounts with known passwords
app.seeding.enabled=${APP_SEEDING_ENABLED:false}

# ■■ Resend (HTTP API — not SMTP, so no port-blocking issues on cloud) ■■■■■■
resend.api-key=${RESEND_API_KEY}

# ■■ App ■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■
app.mail.from=${MAIL_FROM:UniSphere <onboarding@resend.dev>}
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}

# ■■ Redis (Redis Cloud) ■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■
spring.data.redis.repositories.enabled=false
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:default}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}

# ■■ Object storage (S3-compatible — Backblaze B2 / Google Cloud Storage / Garage) ■■
# Endpoint format examples: https://s3.{region}.backblazeb2.com (B2), https://storage.googleapis.com (GCS),
# https://storage.yourdomain.com (self-hosted Garage). Swap providers by changing only these values —
# see miscellaneous/plan/object-storage-provider-swap.md for the full credential matrix.
object-storage.endpoint=${STORAGE_ENDPOINT:}
object-storage.region=${STORAGE_REGION:us-west-004}
object-storage.access-key-id=${STORAGE_ACCESS_KEY_ID:}
object-storage.secret-access-key=${STORAGE_SECRET_ACCESS_KEY:}
object-storage.bucket.posts=${STORAGE_BUCKET_POSTS:posts}
object-storage.presign-expiry-minutes=${STORAGE_PRESIGN_EXPIRY:5}
# Read URLs ride inside feed responses, so they must outlive any client-side caching of that JSON.
# This also bounds how long an already-issued URL keeps working after a viewer loses access.
object-storage.presign-get-expiry-minutes=${STORAGE_PRESIGN_GET_EXPIRY:60}

# ■■ Server ■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■
server.port=${PORT:8081}

# ■■ File upload limits (align with nginx's client_max_body_size in production) ■■■
spring.servlet.multipart.max-file-size=${MAX_UPLOAD_FILE_SIZE:50MB}
spring.servlet.multipart.max-request-size=${MAX_UPLOAD_REQUEST_SIZE:50MB}

# ■■ Gemini (Google AI Studio) ■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-2.0-flash}
gemini.base-url=https://generativelanguage.googleapis.com
gemini.max-history-turns=20
gemini.cache-ttl-hours=24
gemini.session-ttl-hours=24
gemini.connect-timeout-ms=${GEMINI_CONNECT_TIMEOUT:5000}
gemini.read-timeout-ms=${GEMINI_READ_TIMEOUT:30000}

# ■■ Messaging cache ■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■
messaging.history-ttl-hours=48
messaging.history-max-messages=100

# ■■ Rate limiting (Redis-backed, fixed window) ■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■
ratelimit.enabled=${RATE_LIMIT_ENABLED:true}
# Per-IP, every public/unauthenticated endpoint (see RateLimitPaths.PUBLIC_PATHS — auth
# endpoints plus health/swagger/api-docs/ws)
ratelimit.auth.limit=${RATE_LIMIT_AUTH_LIMIT:10}
ratelimit.auth.window-seconds=${RATE_LIMIT_AUTH_WINDOW:60}
# Per-user, every protected endpoint
ratelimit.api.limit=${RATE_LIMIT_API_LIMIT:120}
ratelimit.api.window-seconds=${RATE_LIMIT_API_WINDOW:60}
# Per-user, STOMP SEND frames over the WebSocket session (chat messages etc.) — the HTTP
# filters above only ever see the initial /ws handshake, not messages sent after upgrade
ratelimit.ws.limit=${RATE_LIMIT_WS_LIMIT:60}
ratelimit.ws.window-seconds=${RATE_LIMIT_WS_WINDOW:60}
# Per-path overrides — stricter cap on the chatbot endpoint since it calls the paid Gemini API
ratelimit.overrides[0].path-pattern=/api/v1/campus/chatbot/**
ratelimit.overrides[0].limit=${RATE_LIMIT_CHATBOT_LIMIT:20}
ratelimit.overrides[0].window-seconds=${RATE_LIMIT_CHATBOT_WINDOW:60}
