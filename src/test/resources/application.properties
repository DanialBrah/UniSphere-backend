# ── Datasource ────────────────────────────────────────────────────────────────
# URL / credentials are injected by @ServiceConnection from the MySQLContainer
# defined in AbstractIntegrationTest — do NOT set them here.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ── Liquibase ─────────────────────────────────────────────────────────────────
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# ── JWT (fixed test values — not sensitive) ───────────────────────────────────
jwt.secret=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# ── CORS ──────────────────────────────────────────────────────────────────────
cors.allowed-origins=http://localhost:5173

# ── Server ────────────────────────────────────────────────────────────────────
server.port=8081

# ── Seeding off in tests ──────────────────────────────────────────────────────
app.seeding.enabled=false
