# ── Datasource ────────────────────────────────────────────────────────────────
# URL / credentials are injected by @ServiceConnection from the MySQLContainer
# defined in AbstractIntegrationTest — do NOT set them here.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ── Liquibase ─────────────────────────────────────────────────────────────────
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# ── JWT (fixed test values — not sensitive) ───────────────────────────────────
jwt.secret=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# ── CORS ──────────────────────────────────────────────────────────────────────
cors.allowed-origins=http://localhost:5173

# ── Server ────────────────────────────────────────────────────────────────────
server.port=8081

# ── Resend (dummy key — email sending is not exercised in tests) ──────────────
resend.api-key=re_test_dummy_key_not_used
app.mail.from=UniSphere <noreply@unisphere.app>
app.frontend-url=http://localhost:5173

# ── Seeding off in tests ──────────────────────────────────────────────────────
app.seeding.enabled=false

# ── Redis (Testcontainers — no auth on local container) ──────────────────────
spring.data.redis.password=
spring.data.redis.username=
spring.data.redis.ssl.enabled=false
spring.data.redis.repositories.enabled=false

# ── Backblaze B2 (dummy values — S3 not exercised in tests) ──────────────────
backblaze.b2.endpoint=https://s3.us-west-004.backblazeb2.com
backblaze.b2.region=us-west-004
backblaze.b2.key-id=dummy-key-id
backblaze.b2.application-key=dummy-application-key

# ── Gemini (dummy key — chatbot not exercised in tests) ───────────────────────
gemini.api-key=test-dummy-key-not-used
gemini.model=gemini-2.0-flash
gemini.cache-ttl-hours=24
gemini.session-ttl-hours=24

# ── Rate limiting (off by default — no Redis container in most integration
# tests, and existing tests fire many requests at /auth/*). RateLimitIntegrationTest
# spins up its own Redis Testcontainer and flips this back on. ────────────────
ratelimit.enabled=false
