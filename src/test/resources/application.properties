# ── Datasource ────────────────────────────────────────────────────────────────
# URL / credentials are injected by @ServiceConnection from the MySQLContainer
# defined in AbstractIntegrationTest — do NOT set them here.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ── Liquibase ─────────────────────────────────────────────────────────────────
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# ── JWT (fixed test values — not sensitive) ───────────────────────────────────
jwt.secret=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# ── CORS ──────────────────────────────────────────────────────────────────────
cors.allowed-origins=http://localhost:5173

# ── Server ────────────────────────────────────────────────────────────────────
server.port=8081

# ── Mail (dummy values — email sending is not exercised in tests) ─────────────
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=test@test.com
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.starttls.required=false
app.mail.from=UniSphere <noreply@unisphere.app>
app.frontend-url=http://localhost:5173

# ── Seeding off in tests ──────────────────────────────────────────────────────
app.seeding.enabled=false
