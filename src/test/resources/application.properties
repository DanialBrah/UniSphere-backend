# ── Database (MySQL — make sure MySQL is running before running tests) ────────
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/unisphere}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ── Liquibase ─────────────────────────────────────────────────────────────
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# ── JWT (test values — not sensitive) ─────────────────────────────────────
jwt.secret=${JWT_SECRET:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# ── CORS ──────────────────────────────────────────────────────────────────
cors.allowed-origins=http://localhost:5173

# ── Server ────────────────────────────────────────────────────────────────
server.port=8081
